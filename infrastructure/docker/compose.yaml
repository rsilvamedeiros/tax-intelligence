services:
  identity:
    image: quay.io/keycloak/keycloak:26.8.0
    profiles: ['identity']
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: local_admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      KC_HOSTNAME: http://127.0.0.1:8080
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
      - tax_identity_data:/opt/keycloak/data
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tax_local
      # Required from the local environment; no default credential.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: tax_intelligence
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - tax_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tax_local -d tax_intelligence']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  tax_pg_data:
  tax_identity_data:
